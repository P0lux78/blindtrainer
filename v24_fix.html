 patchOld('(() => {\n  "use strict";', '(() => {\n  "use strict";\n' + "  // Blind Trainer V9: almacenamiento local aislado de las versiones cl\u00e1sicas.\n  // Esta capa se introduce dentro del cierre de index.html, antes de su l\u00f3gica.\n  const BT9_PREFIX = 'blindCloudV9:';\n  const BT9_NATIVE = window.localStorage;\n  const localStorage = {\n    getItem(key) { return BT9_NATIVE.getItem(BT9_PREFIX + String(key)); },\n    setItem(key, value) {\n      BT9_NATIVE.setItem(BT9_PREFIX + String(key), String(value));\n      window.dispatchEvent(new CustomEvent('bt9-local-change', {detail:{key:String(key)}}));\n    },\n    removeItem(key) {\n      BT9_NATIVE.removeItem(BT9_PREFIX + String(key));\n      window.dispatchEvent(new CustomEvent('bt9-local-change', {detail:{key:String(key)}}));\n    },\n    key(index) {\n      const keys=[];\n      for(let i=0;i<BT9_NATIVE.length;i++){\n        const k=BT9_NATIVE.key(i);\n        if(k && k.startsWith(BT9_PREFIX)) keys.push(k.slice(BT9_PREFIX.length));\n      }\n      return keys[index] ?? null;\n    },\n    get length() {\n      let count=0;\n      for(let i=0;i<BT9_NATIVE.length;i++) if((BT9_NATIVE.key(i)||'').startsWith(BT9_PREFIX)) count++;\n      return count;\n    }\n  };\n  window.__blindCloudV9Storage = localStorage;\n  // Firebase Authentication es ahora la puerta de entrada; no duplicar la clave local.\n  // V21: omitir la barrera local antigua.\n  localStorage.setItem('blindOpPasswordDisabledV2','1');\n", 'almacenamiento V9 aislado');

sejs/11.10.0/firebase-app.js';\nimport {getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';\nimport {getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, getDocs, writeBatch, serverTimestamp, onSnapshot} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';\n\n// Configuraci\u00f3n p\u00fablica del proyecto. NUNCA se incluye una contrase\u00f1a ni el historial en GitHub.\nconst firebaseConfig = {\n  apiKey: 'AIzaSyBFMcWUYfaC3HBDa25SVwlEQ_O_HGQgzx8',\n  authDomain: 'blind-trainer.firebaseapp.com',\n  projectId: 'blind-trainer',\n  storageBucket: 'blind-trainer.firebasestorage.app',\n  messagingSenderId: '316230978765',\n  appId: '1:316230978765:web:a820f888a57687faf5ad84'\n};\n\nconst firebaseApp=initializeApp(firebaseConfig);\nconst auth=getAuth(firebaseApp);\n// Cach\u00e9 persistente de Firestore: permite conservar operaciones pendientes sin red.\nlet db;\ntry {\n  db=initializeFirestore(firebaseApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});\n} catch(error) {\n  console.warn('No se pudo habilitar la persistencia, se usar\u00e1 el cach\u00e9 normal:',error);\n  db=getFirestore(firebaseApp);\n}\nconst el=id=>document.getElementById(id);\nconst cache=window.__blindCloudV9Storage;\nconst cloneJson=(v,fallback)=>{try{return JSON.parse(v)}catch{return fallback}};\nconst profileKey=(id,part)=>`blindOpProfile:${id}:${part}`;\nconst uniqKey=x=>`${x.sessionId || ''}|${x.position || 0}`;\nlet user=null, ready=false, syncing=false, rerun=false, syncTimer=null, syncingStatus='';\nlet lastRoster='', lastProfiles=new Map(), lastSessions=new Map();\nlet remoteSessions=new Map();\nlet currentLoadToken=0, lastPullAt=0;\nlet liveUnsubs=[], pendingVisualUpdate=false, liveTimer=null;\nlet liveSyncDebounce=null, liveBuffering=false;\nconst deferredSessions=new Set(), deferredProfileDocs=new Map();\nlet deferredRoster=null;\n\nfunction status(message, isError=false){\n  syncingStatus=message;\n  if(el('bt9CloudStatus')){\n    el('bt9CloudStatus').textContent=' \u00b7 '+message;\n    el('bt9CloudStatus').style.color=isError?'#fda4af':'#94a3b8';\n  }\n  if(el('bt9StartStatus')) el('bt9StartStatus').textContent=message;\n}\nfunction fatal(message){status(message,true);el('bt9AuthFields').hidden=false;el('bt9Cover').hidden=false;}\nfunction snapshot(){\n  const profiles=cloneJson(cache.getItem('blindOpProfiles'),[]);\n  if(!Array.isArray(profiles)) throw Error('Lista de perfiles incorrecta.');\n  if(profiles.length>5) throw Error('Se ha superado el m\u00e1ximo de cinco perfiles.');\n  return {\n    profiles: profiles.map(p=>({id:String(p.id),name:String(p.name),createdAt:p.createdAt||''})),\n    selected:cache.getItem('blindOpActiveProfileId'),\n    profileData:profiles.map(p=>({\n      id:p.id,\n      cards:cloneJson(cache.getItem(profileKey(p.id,'cards')),null),\n      stats:cloneJson(cache.getItem(profileKey(p.id,'stats')),{}),\n      preferences:cloneJson(cache.getItem(profileKey(p.id,'preferences')),{}),\n      attempts:cloneJson(cache.getItem(profileKey(p.id,'attemptHistory')),[])\n    }))\n  };\n}\nfunction groupSessions(snapshotValue){\n  const out=new Map();\n  for(const p of snapshotValue.profileData){\n    if(!Array.isArray(p.attempts)) continue;\n    for(const a of p.attempts){\n      const sid=String(a.sessionId||'');\n      if(!sid || sid.includes('/') || sid==='.' || sid==='..') continue;\n      const key=`${p.id}__${sid}`;\n      if(!out.has(key))out.set(key,{profileId:p.id,sessionId:sid,attempts:[]});\n      out.get(key).attempts.push(a);\n    }\n  }\n  for(const val of out.values())val.attempts.sort((a,b)=>(Number(a.position)||0)-(Number(b.position)||0));\n  return out;\n}\nfunction savedProfilesKey(uid){return 'blindCloudV9KnownUser';}\nfunction cloudRef(){return doc(db,'users',user.uid,'workspace','main')}\nfunction profileRef(pid){return doc(db,'users',user.uid,'profiles',pid)}\nfunction sessionRef(key){return doc(db,'users',user.uid,'sessions',key)}\nfunction isGameActive(){\n  return el('gamePanel')?.classList.contains('show') || (el('voicePanel') && !el('voicePanel').classList.contains('hidden'));\n}\nfunction mergeAttempts(remote,local){\n  const entries=new Map();\n  for(const a of remote || [])entries.set(uniqKey(a),a);\n  for(const a of local || []){\n    const key=uniqKey(a), existing=entries.get(key);\n    if(!existing){entries.set(key,a);continue}\n    // Si corregiste un resultado sin conexi\u00f3n, prevalece la correcci\u00f3n m\u00e1s nueva.\n    const oldCorrection=Date.parse(existing.correctedAt||'')||0;\n    const localCorrection=Date.parse(a.correctedAt||'')||0;\n    if(localCorrection>oldCorrection)entries.set(key,a);\n  }\n  return [...entries.values()].sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')) || ((Number(a.position)||0)-(Number(b.position)||0)));\n}\nfunction rememberLocal(label){\n  const snap=snapshot();\n  const data={format:'blindtrainer-v9-backup',date:new Date().toISOString(),label,profiles:snap.profiles,data:snap.profileData};\n  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});\n  const url=URL.createObjectURL(blob), link=document.createElement('a');\n  link.href=url;link.download=`blindtrainer_copia_${new Date().toISOString().slice(0,10)}.json`;\n  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);\n}\nfunction mapFromCurrent(){\n  const s=snapshot();\n  lastRoster=JSON.stringify(s.profiles);\n  lastProfiles=new Map(s.profileData.map(p=>[p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences})]));\n  lastSessions=new Map([...groupSessions(s)].map(([k,v])=>[k,JSON.stringify(v.attempts)]));\n}\n\n// Sincronizaci\u00f3n segura: escribe \u00fanicamente lo que haya cambiado, sin duplicar partidas.\nasync function syncNow(force=false){\n  if(!ready || !user)return;\n  if(syncing){rerun=true;return}\n  syncing=true;\n  try{\n    const local=snapshot(), groups=groupSessions(local), operations=[];\n    const roster=JSON.stringify(local.profiles);\n    if(lastRoster!==roster || force && !lastRoster){\n      operations.push({ref:cloudRef(),data:{profiles:local.profiles,version:1,updatedAt:serverTimestamp()}});\n    }\n    for(const p of local.profileData){\n      const encoded=JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences});\n      if(encoded!==lastProfiles.get(p.id)){\n        operations.push({ref:profileRef(p.id),data:{cards:p.cards||[],stats:p.stats||{},preferences:p.preferences||{},updatedAt:serverTimestamp()}});\n      }\n    }\n    for(const [key,item] of groups){\n      const encoded=JSON.stringify(item.attempts);\n      if(encoded!==lastSessions.get(key)){\n        operations.push({ref:sessionRef(key),data:{profileId:item.profileId,sessionId:item.sessionId,attempts:item.attempts,updatedAt:serverTimestamp()}});\n      }\n    }\n    if(!operations.length){status('Datos al d\u00eda');return}\n    status(`Guardando ${operations.length} cambios\u2026`);\n    // Firestore permite lotes de hasta 500 operaciones; aqu\u00ed usamos 200 para mayor margen.\n    for(let offset=0;offset<operations.length;offset+=200){\n      const batch=writeBatch(db);\n      for(const op of operations.slice(offset,offset+200))batch.set(op.ref,op.data);\n      await batch.commit();\n    }\n    lastRoster=roster;\n    for(const p of local.profileData)lastProfiles.set(p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences}));\n    for(const [key,item] of groups)lastSessions.set(key,JSON.stringify(item.attempts));\n    status(`${groups.size} partidas en la nube`);\n  }catch(error){\n    console.error('Blind Trainer nube: error al guardar',error);\n    status('No se pudo sincronizar. Los datos siguen guardados en este dispositivo.',true);\n  }finally{\n    syncing=false;\n    if(rerun){rerun=false;scheduleSync(600)}\n  }\n}\nfunction scheduleSync(delay=1700){\n  if(!ready)return;\n  clearTimeout(syncTimer);\n  syncTimer=setTimeout(()=>syncNow(),delay);\n}\nwindow.addEventListener('bt9-local-change',event=>{\n  const key=event.detail?.key || '';\n  if(key==='blindOpProfiles' || key.startsWith('blindOpProfile:'))scheduleSync();\n});\nwindow.addEventListener('online',()=>{\n  if(!ready)return;\n  status('Conexi\u00f3n recuperada. Enviando pendientes\u2026');\n  scheduleSync(450);\n});\nwindow.addEventListener('offline',()=>{\n  if(ready)status('Sin conexi\u00f3n. Partidas guardadas en este dispositivo hasta volver a conectarte.');\n});\ndocument.addEventListener('visibilitychange',()=>{\n  if(document.visibilityState==='visible' && ready){\n    scheduleSync(750);\n    requestVisualUpdate();\n  }\n});\n\nasync function bootstrapCloud(loggedIn){\n  stopLiveSync();\n  const token=++currentLoadToken;\n  user=loggedIn;\n  ready=false;\n  status('Consultando perfiles de Firebase\u2026');\n  const metaSnapshot=await getDoc(cloudRef());\n  if(token!==currentLoadToken)return;\n  if(!metaSnapshot.exists()){\n    // Primera conexi\u00f3n: se crea la estructura del usuario, sin publicar ning\u00fan CSV.\n    const local=snapshot();\n    if(!local.profiles.length)throw Error('No encuentro los perfiles del entrenador.');\n    const batch=writeBatch(db);\n    batch.set(cloudRef(),{profiles:local.profiles,version:1,updatedAt:serverTimestamp()});\n    for(const p of local.profileData){\n      batch.set(profileRef(p.id),{cards:p.cards||[],stats:p.stats||{},preferences:p.preferences||{},updatedAt:serverTimestamp()});\n    }\n    await batch.commit();\n    lastRoster=JSON.stringify(local.profiles);\n    lastProfiles=new Map(local.profileData.map(p=>[p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences})]));\n    lastSessions=new Map();\n    status('Nube creada. Importa tu CSV cuando quieras.');\n
