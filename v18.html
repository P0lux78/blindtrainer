 patchOld('(() => {\n  "use strict";', '(() => {\n  "use strict";\n' + "  // Blind Trainer V9: almacenamiento local aislado de las versiones cl\u00e1sicas.\n  // Esta capa se introduce dentro del cierre de index.html, antes de su l\u00f3gica.\n  const BT9_PREFIX = 'blindCloudV9:';\n  const BT9_NATIVE = window.localStorage;\n  const localStorage = {\n    getItem(key) { return BT9_NATIVE.getItem(BT9_PREFIX + String(key)); },\n    setItem(key, value) {\n      BT9_NATIVE.setItem(BT9_PREFIX + String(key), String(value));\n      window.dispatchEvent(new CustomEvent('bt9-local-change', {detail:{key:String(key)}}));\n    },\n    removeItem(key) {\n      BT9_NATIVE.removeItem(BT9_PREFIX + String(key));\n      window.dispatchEvent(new CustomEvent('bt9-local-change', {detail:{key:String(key)}}));\n    },\n    key(index) {\n      const keys=[];\n      for(let i=0;i<BT9_NATIVE.length;i++){\n        const k=BT9_NATIVE.key(i);\n        if(k && k.startsWith(BT9_PREFIX)) keys.push(k.slice(BT9_PREFIX.length));\n      }\n      return keys[index] ?? null;\n    },\n    get length() {\n      let count=0;\n      for(let i=0;i<BT9_NATIVE.length;i++) if((BT9_NATIVE.key(i)||'').startsWith(BT9_PREFIX)) count++;\n      return count;\n    }\n  };\n  window.__blindCloudV9Storage = localStorage;\n  // Firebase Authentication es ahora la puerta de entrada; no duplicar la clave local.\n  if(localStorage.getItem('blindOpPasswordDisabledV2') === null) {\n    localStorage.setItem('blindOpPasswordDisabledV2','1');\n  }\n", 'almacenamiento V9 aislado');

 patchOld('</body>', "<div id=\"bt9Cover\" class=\"bt9-cover\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Blind Trainer en la nube\">\n <section class=\"bt9-panel\">\n  <h2>\u2601\ufe0f Blind Trainer \u00b7 Nube<\/h2>\n  <p>Las partidas, asociaciones y perfiles se sincronizan entre tus dispositivos con Firebase.<\/p>\n  <div id=\"bt9AuthFields\" hidden>\n   <form id=\"bt9AuthForm\">\n    <label for=\"bt9Email\">Correo de Firebase<\/label>\n    <input id=\"bt9Email\" type=\"email\" autocomplete=\"username\" required>\n    <label for=\"bt9Password\">Contrase\u00f1a<\/label>\n    <input id=\"bt9Password\" type=\"password\" autocomplete=\"current-password\" required>\n    <p class=\"bt9-error\" id=\"bt9AuthError\" role=\"alert\"><\/p>\n    <button type=\"submit\" id=\"bt9SignIn\">Entrar en mis perfiles<\/button>\n   <\/form>\n  <\/div>\n  <p id=\"bt9StartStatus\" class=\"bt9-status\">Iniciando conexi\u00f3n segura\u2026<\/p>\n  <p style=\"font-size:.78rem\">Tu historial no forma parte de los archivos p\u00fablicos de GitHub. Nunca compartas aqu\u00ed tu contrase\u00f1a.<\/p>\n <\/section>\n<\/div>\n<div class=\"bt9-bar\" id=\"bt9Bar\" hidden>\n <div class=\"bt9-bar-header\">\n  <div><strong>\u2601\ufe0f Blind Trainer<\/strong><small id=\"bt9CloudStatus\"> \u00b7 Sincronizaci\u00f3n pendiente<\/small><\/div>\n  <button type=\"button\" id=\"bt9Toggle\">Opciones<\/button>\n <\/div>\n <div class=\"bt9-bar-actions\" id=\"bt9Actions\" hidden>\n  <button type=\"button\" id=\"bt9ImportCsv\" class=\"bt9-green\">\ud83d\udce5 Importar historial CSV<\/button>\n  <button type=\"button\" id=\"bt9Sync\">\ud83d\udd04 Sincronizar ahora<\/button>\n  <button type=\"button\" id=\"bt9Export\">\ud83d\udcbe Copia local<\/button>\n  <button type=\"button\" id=\"bt9Logout\">Salir de la nube<\/button>\n <\/div>\n <input id=\"bt9InputCsv\" type=\"file\" accept=\".csv,text/csv\" hidden>\n<\/div>\n" + '<scr'+'ipt type="module">\n' + "import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';\nimport {getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';\nimport {getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, getDocs, writeBatch, serverTimestamp, onSnapshot} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';\n\n// Configuraci\u00f3n p\u00fablica del proyecto. NUNCA se incluye una contrase\u00f1a ni el historial en GitHub.\nconst firebaseConfig = {\n  apiKey: 'AIzaSyBFMcWUYfaC3HBDa25SVwlEQ_O_HGQgzx8',\n  authDomain: 'blind-trainer.firebaseapp.com',\n  projectId: 'blind-trainer',\n  storageBucket: 'blind-trainer.firebasestorage.app',\n  messagingSenderId: '316230978765',\n  appId: '1:316230978765:web:a820f888a57687faf5ad84'\n};\n\nconst firebaseApp=initializeApp(firebaseConfig);\nconst auth=getAuth(firebaseApp);\n// Cach\u00e9 persistente de Firestore: permite conservar operaciones pendientes sin red.\nlet db;\ntry {\n  db=initializeFirestore(firebaseApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});\n} catch(error) {\n  console.warn('No se pudo habilitar la persistencia, se usar\u00e1 el cach\u00e9 normal:',error);\n  db=getFirestore(firebaseApp);\n}\nconst el=id=>document.getElementById(id);\nconst cache=window.__blindCloudV9Storage;\nconst cloneJson=(v,fallback)=>{try{return JSON.parse(v)}catch{return fallback}};\nconst profileKey=(id,part)=>`blindOpProfile:${id}:${part}`;\nconst uniqKey=x=>`${x.sessionId || ''}|${x.position || 0}`;\nlet user=null, ready=false, syncing=false, rerun=false, syncTimer=null, syncingStatus='';\nlet lastRoster='', lastProfiles=new Map(), lastSessions=new Map();\nlet remoteSessions=new Map();\nlet currentLoadToken=0, lastPullAt=0;\nlet liveUnsubs=[], pendingVisualUpdate=false, liveTimer=null;\nlet liveSyncDebounce=null, liveBuffering=false;\nconst deferredSessions=new Set(), deferredProfileDocs=new Map();\nlet deferredRoster=null;\n\nfunction status(message, isError=false){\n  syncingStatus=message;\n  if(el('bt9CloudStatus')){\n    el('bt9CloudStatus').textContent=' \u00b7 '+message;\n    el('bt9CloudStatus').style.color=isError?'#fda4af':'#94a3b8';\n  }\n  if(el('bt9StartStatus')) el('bt9StartStatus').textContent=message;\n}\nfunction fatal(message){status(message,true);el('bt9AuthFields').hidden=false;el('bt9Cover').hidden=false;}\nfunction snapshot(){\n  const profiles=cloneJson(cache.getItem('blindOpProfiles'),[]);\n  if(!Array.isArray(profiles)) throw Error('Lista de perfiles incorrecta.');\n  if(profiles.length>5) throw Error('Se ha superado el m\u00e1ximo de cinco perfiles.');\n  return {\n    profiles: profiles.map(p=>({id:String(p.id),name:String(p.name),createdAt:p.createdAt||''})),\n    selected:cache.getItem('blindOpActiveProfileId'),\n    profileData:profiles.map(p=>({\n      id:p.id,\n      cards:cloneJson(cache.getItem(profileKey(p.id,'cards')),null),\n      stats:cloneJson(cache.getItem(profileKey(p.id,'stats')),{}),\n      preferences:cloneJson(cache.getItem(profileKey(p.id,'preferences')),{}),\n      attempts:cloneJson(cache.getItem(profileKey(p.id,'attemptHistory')),[])\n    }))\n  };\n}\nfunction groupSessions(snapshotValue){\n  const out=new Map();\n  for(const p of snapshotValue.profileData){\n    if(!Array.isArray(p.attempts)) continue;\n    for(const a of p.attempts){\n      const sid=String(a.sessionId||'');\n      if(!sid || sid.includes('/') || sid==='.' || sid==='..') continue;\n      const key=`${p.id}__${sid}`;\n      if(!out.has(key))out.set(key,{profileId:p.id,sessionId:sid,attempts:[]});\n      out.get(key).attempts.push(a);\n    }\n  }\n  for(const val of out.values())val.attempts.sort((a,b)=>(Number(a.position)||0)-(Number(b.position)||0));\n  return out;\n}\nfunction savedProfilesKey(uid){return 'blindCloudV9KnownUser';}\nfunction cloudRef(){return doc(db,'users',user.uid,'workspace','main')}\nfunction profileRef(pid){return doc(db,'users',user.uid,'profiles',pid)}\nfunction sessionRef(key){return doc(db,'users',user.uid,'sessions',key)}\nfunction isGameActive(){\n  return el('gamePanel')?.classList.contains('show') || (el('voicePanel') && !el('voicePanel').classList.contains('hidden'));\n}\nfunction mergeAttempts(remote,local){\n  const entries=new Map();\n  for(const a of remote || [])entries.set(uniqKey(a),a);\n  for(const a of local || []){\n    const key=uniqKey(a), existing=entries.get(key);\n    if(!existing){entries.set(key,a);continue}\n    // Si corregiste un resultado sin conexi\u00f3n, prevalece la correcci\u00f3n m\u00e1s nueva.\n    const oldCorrection=Date.parse(existing.correctedAt||'')||0;\n    const localCorrection=Date.parse(a.correctedAt||'')||0;\n    if(localCorrection>oldCorrection)entries.set(key,a);\n  }\n  return [...entries.values()].sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')) || ((Number(a.position)||0)-(Number(b.position)||0)));\n}\nfunction rememberLocal(label){\n  const snap=snapshot();\n  const data={format:'blindtrainer-v9-backup',date:new Date().toISOString(),label,profiles:snap.profiles,data:snap.profileData};\n  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});\n  const url=URL.createObjectURL(blob), link=document.createElement('a');\n  link.href=url;link.download=`blindtrainer_copia_${new Date().toISOString().slice(0,10)}.json`;\n  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);\n}\nfunction mapFromCurrent(){\n  const s=snapshot();\n  lastRoster=JSON.stringify(s.profiles);\n  lastProfiles=new Map(s.profileData.map(p=>[p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences})]));\n  lastSessions=new Map([...groupSessions(s)].map(([k,v])=>[k,JSON.stringify(v.attempts)]));\n}\n\n// Sincronizaci\u00f3n segura: escribe \u00fanicamente lo que haya cambiado, sin duplicar partidas.\nasync function syncNow(force=false){\n  if(!ready || !user)return;\n  if(syncing){rerun=true;return}\n  syncing=true;\n  try{\n    const local=snapshot(), groups=groupSessions(local), operations=[];\n    const roster=JSON.stringify(local.profiles);\n    if(lastRoster!==roster || force && !lastRoster){\n      operations.push({ref:cloudRef(),data:{profiles:local.profiles,version:1,updatedAt:serverTimestamp()}});\n    }\n    for(const p of local.profileData){\n      const encoded=JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences});\n      if(encoded!==lastProfiles.get(p.id)){\n        operations.push({ref:profileRef(p.id),data:{cards:p.cards||[],stats:p.stats||{},preferences:p.preferences||{},updatedAt:serverTimestamp()}});\n      }\n    }\n    for(const [key,item] of groups){\n      const encoded=JSON.stringify(item.attempts);\n      if(encoded!==lastSessions.get(key)){\n        operations.push({ref:sessionRef(key),data:{profileId:item.profileId,sessionId:item.sessionId,attempts:item.attempts,updatedAt:serverTimestamp()}});\n      }\n    }\n    if(!operations.length){status('Datos al d\u00eda');return}\n    status(`Guardando ${operations.length} cambios\u2026`);\n    // Firestore permite lotes de hasta 500 operaciones; aqu\u00ed usamos 200 para mayor margen.\n    for(let offset=0;offset<operations.length;offset+=200){\n      const batch=writeBatch(db);\n      for(const op of operations.slice(offset,offset+200))batch.set(op.ref,op.data);\n      await batch.commit();\n    }\n    lastRoster=roster;\n    for(const p of local.profileData)lastProfiles.set(p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences}));\n    for(const [key,item] of groups)lastSessions.set(key,JSON.stringify(item.attempts));\n    status(`${groups.size} partidas en la nube`);\n  }catch(error){\n    console.error('Blind Trainer nube: error al guardar',error);\n    status('No se pudo sincronizar. Los datos siguen guardados en este dispositivo.',true);\n  }finally{\n    syncing=false;\n    if(rerun){rerun=false;scheduleSync(600)}\n  }\n}\nfunction scheduleSync(delay=1700){\n  if(!ready)return;\n  clearTimeout(syncTimer);\n  syncTimer=setTimeout(()=>syncNow(),delay);\n}\nwindow.addEventListener('bt9-local-change',event=>{\n  const key=event.detail?.key || '';\n  if(key==='blindOpProfiles' || key.startsWith('blindOpProfile:'))scheduleSync();\n});\nwindow.addEventListener('online',()=>{\n  if(!ready)return;\n  status('Conexi\u00f3n recuperada. Enviando pendientes\u2026');\n  scheduleSync(450);\n});\nwindow.addEventListener('offline',()=>{\n  if(ready)status('Sin conexi\u00f3n. Partidas guardadas en este dispositivo hasta volver a conectarte.');\n});\ndocument.addEventListener('visibilitychange',()=>{\n  if(document.visibilityState==='visible' && ready){\n    scheduleSync(750);\n    requestVisualUpdate();\n  }\n});\n\nasync function bootstrapCloud(loggedIn){\n  stopLiveSync();\n  const token=++currentLoadToken;\n  user=loggedIn;\n  ready=false;\n  status('Consultando perfiles de Firebase\u2026');\n  const metaSnapshot=await getDoc(cloudRef());\n  if(token!==currentLoadToken)return;\n  if(!metaSnapshot.exists()){\n    // Primera conexi\u00f3n: se crea la estructura del usuario, sin publicar ning\u00fan CSV.\n    const local=snapshot();\n    if(!local.profiles.length)throw Error('No encuentro los perfiles del entrenador.');\n    const batch=writeBatch(db);\n    batch.set(cloudRef(),{profiles:local.profiles,version:1,updatedAt:serverTimestamp()});\n    for(const p of local.profileData){\n      batch.set(profileRef(p.id),{cards:p.cards||[],stats:p.stats||{},preferences:p.preferences||{},updatedAt:serverTimestamp()});\n    }\n    await batch.commit();\n    lastRoster=JSON.stringify(local.profiles);\n    lastProfiles=new Map(local.profileData.map(p=>[p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences})]));\n    lastSessions=new Map();\n    status('Nube creada. Importa tu CSV cuando quieras.');\n  }else{\n    const remoteMeta=metaSnapshot.data(), remoteProfiles=remoteMeta.profiles||[];\n    if(!Array.isArray(remoteProfiles) || remoteProfiles.length>5)throw Error('Los perfiles de Firebase no tienen un formato v\u00e1lido.');\n    const profileDocs=await Promise.all(remoteProfiles.map(p=>getDoc(profileRef(p.id))));\n    const sessionDocs=await getDocs(collection(db,'users',user.uid,'sessions'));\n    if(token!==currentLoadToken)return;\n    remoteSessions=new Map();\n    for(const row of sessionDocs.docs){\n      const d=row.data();if(d.profileId && Array.isArray(d.attempts))remoteSessions.set(row.id,d);\n    }\n    const knownSameUser=window.localStorage.getItem(savedProfilesKey(user.uid))===user.uid;\n    const prior=snapshot();\n    const localById=new Map(prior.profileData.map(p=>[p.id,p]));\n    const remoteGrouped=new Map();\n    for(const data of remoteSessions.values()){\n      if(!remoteGrouped.has(data.profileId))remoteGrouped.set(data.profileId,[]);\n      remoteGrouped.get(data.profileId).push(...data.attempts);\n    }\n    let changed=cache.getItem('blindOpProfiles')!==JSON.stringify(remoteProfiles);\n    cache.setItem('blindOpProfiles',JSON.stringify(remoteProfiles));\n    if(!remoteProfiles.some(p=>p.id===cache.getItem('blindOpActiveProfileId'))){\n      cache.setItem('blindOpActiveProfileId',remoteProfiles[0]?.id||'');changed=true;\n    }\n    for(let i=0;i<remoteProfiles.length;i++){\n      const p=remoteProfiles[i], d=profileDocs[i].exists()?profileDocs[i].data():{};\n      const local=localById.get(p.id);\n      for(const part of ['cards','stats','preferences']){\n        const value=d[part]??(knownSameUser?local?.[part]:null)??(part==='cards'?[]:{});\n        const serialized=JSON.stringify(value);\n        if(cache.getItem(profileKey(p.id,part))!==serialized){changed=true;cache.setItem(profileKey(p.id,part),serialized)}\n      }\n      // Ya se est\u00e1 trayendo la tabla JOAN de Firebase: impedir que la migraci\u00f3n\n      // antigua de 420 asociaciones sobrescriba ediciones hechas en otro dispositivo.\n      if(String(p.name).trim().toUpperCase()==='JOAN'){\n        cache.setItem(profileKey(p.id,'joan420MigratedV2'),'1');\n      }\n      const remoteAttempts=remoteGrouped.get(p.id)||[];\n      const attempts=mergeAttempts(remoteAttempts,knownSameUser?local?.attempts:[]);\n      const serialized=JSON.stringify(attempts);\n      if(cache.getItem(profileKey(p.id,'attemptHistory'))!==serialized){changed=true;cache.setItem(profileKey(p.id,'attemptHistory'),serialized)}\n    }\n    lastRoster=JSON.stringify(remoteProfiles);\n    lastProfiles=new Map(remoteProfiles.map((p,i)=>{\n      const x=profileDocs[i].exists()?profileDocs[i].data():{};\n      return [p.id,JSON.stringify({cards:x.cards||[],stats:x.stats||{},preferences:x.preferences||{}})];\n    }));\n    lastSessions=new Map([...remoteSessions].map(([k,v])=>[k,JSON.stringify(v.attempts)]));\n    if(changed && sessionStorage.getItem('bt9CloudHydrated')!==user.uid){\n      sessionStorage.setItem('bt9CloudHydrated',user.uid);\n      window.localStorage.setItem(savedProfilesKey(user.uid),user.uid);\n      location.reload();return;\n    }\n    status(`${remoteSessions.size} partidas recuperadas`);\n  }\n  window.localStorage.setItem(savedProfilesKey(user.uid),user.uid);\n  ready=true;\n  el('bt9Cover').hidden=true;\n  el('bt9Bar').hidden=false;\n  el('bt9AuthFields').hidden=true;\n  if(metaSnapshot.exists())scheduleSync(700);\n  startLiveSync();\n}\n\n// V10: tres listeners de Firestore, activos mientras la sesi\u00f3n de Firebase est\u00e1 abierta.\n// S\u00f3lo vuelcan cambios en los datos locales; no recargan la p\u00e1gina ni abortan el micro.\nfunction stopLiveSync(){\n  for(const unsub of liveUnsubs){try{unsub()}catch{}}\n  liveUnsubs=[];\n  clearTimeout(liveSyncDebounce);\n  clearInterval(liveTimer);\n  liveTimer=null;pendingVisualUpdate=false;\n  deferredSessions.clear();deferredProfileDocs.clear();deferredRoster=null;\n}\nfunction requestVisualUpdate(){\n  pendingVisualUpdate=true;\n  if(!isGameActive() && window.__blindV10ApplyCloudToUI?.())pendingVisualUpdate=false;\n}\nfunction smartStatsFromHistory(profileId){\n  const history=cloneJson(cache.getItem(profileKey(profileId,'attemptHistory')),[]);\n  const previous=cloneJson(cache.getItem(profileKey(profileId,'stats')),{});\n  const result={};\n  for(const row of history){\n    const code=String(row.code||'');if(!code)continue;\n    if(!result[code])result[code]={...(previous[code]||{}),correct:0,wrong:0};\n    if(row.finalCorrect)result[code].correct++;\n    else result[code].wrong++;\n  }\n  // Conservamos metadata de entrenamiento de parejas a\u00fan sin partidas.\n  for(const [code,st] of Object.entries(previous)){\n    if(!result[code] && (st.smartPriority || st.smartUpdatedAt))\n      result[code]={...st,correct:0,wrong:0};\n  }\n  return result;\n}\nfunction combineCloudHistory(profileId){\n  const all=[];\n  for(const item of remoteSessions.values())if(item.profileId===profileId)all.push(...item.attempts);\n  const old=cloneJson(cache.getItem(profileKey(profileId,'attemptHistory')),[]);\n  const merged=mergeAttempts(all,old);\n  const text=JSON.stringify(merged);\n  if(cache.getItem(profileKey(profileId,'attemptHistory'))===text)return false;\n  cache.setItem(profileKey(profileId,'attemptHistory'),text);\n  const rebuilt=JSON.stringify(smartStatsFromHistory(profileId));\n  if(cache.getItem(profileKey(profileId,'stats'))!==rebuilt)cache.setItem(profileKey(profileId,'stats'),rebuilt);\n  return true;\n}\nfunction startLiveSync(){\n  stopLiveSync();\n  if(!ready || !user)return;\n  const uid=user.uid;\n  const valid=()=>ready && !!user && user.uid===uid;\n  function report(error){\n    if(!valid())return;\n    console.warn('Escucha Firebase:',error);\n    status('No se reciben cambios en directo; la copia local se conserva.',true);\n  }\n  // Una colecci\u00f3n de sesiones por usuario; no se reemplaza el historial entero.\n  liveUnsubs.push(onSnapshot(collection(db,'users',uid,'sessions'),{includeMetadataChanges:false},snap=>{\n    if(!valid() || snap.metadata.hasPendingWrites)return;\n    const touched=new Set();\n    for(const changed of snap.docChanges()){\n      const key=changed.doc.id;\n      if(changed.type==='removed'){\n        remoteSessions.delete(key);lastSessions.delete(key);\n        continue;\n      }\n      const data=changed.doc.data();\n      if(!data.profileId || !Array.isArray(data.attempts))continue;\n      const before=remoteSessions.get(key);\n      remoteSessions.set(key,data);\n      lastSessions.set(key,JSON.stringify(data.attempts));\n      if(JSON.stringify(before?.attempts)!==JSON.stringify(data.attempts))touched.add(data.profileId);\n    }\n    let changes=0;\n    for(const profileId of touched){\n      if(isGameActive() || el('editorDialog')?.open){deferredSessions.add(profileId);continue;}\n      if(combineCloudHistory(profileId))changes++;\n    }\n    if(changes){\n      requestVisualUpdate();\n      scheduleSync(900); // sube \u00fanicamente intentos locales que falten en Firebase\n    }\n    if(!snap.metadata.fromCache && changes)status('Cambios de otros dispositivos recibidos');\n  },report));\n  liveUnsubs.push(onSnapshot(collection(db,'users',uid,'profiles'),{includeMetadataChanges:false},snap=>{\n    if(!valid() || snap.metadata.hasPendingWrites)return;\n    let changedAny=false;\n    for(const ch of snap.docChanges()){\n      if(ch.type==='removed')continue;\n      const id=ch.doc.id;\n      const d=ch.doc.data();\n      if(isGameActive() || el('editorDialog')?.open || el('profilesDialog')?.open){\n        deferredProfileDocs.set(id,d);continue;\n      }\n      if(applyLiveProfile(id,d))changedAny=true;\n    }\n    if(changedAny){requestVisualUpdate();scheduleSync(1100)}\n  },report));\n  function applyLiveProfile(id,d){\n      let changedAny=false;\n      const baseline=cloneJson(lastProfiles.get(id),{});\n      const local={\n        cards:cloneJson(cache.getItem(profileKey(id,'cards')),[]),\n        stats:cloneJson(cache.getItem(profileKey(id,'stats')),{}),\n        preferences:cloneJson(cache.getItem(profileKey(id,'preferences')),{})\n      };\n      lastProfiles.set(id,JSON.stringify({cards:d.cards||[],stats:d.stats||{},preferences:d.preferences||{}}));\n      // Conservamos cambios locales no enviados, por ejemplo una edici\u00f3n offline.\n      for(const part of ['cards','preferences']){\n        if(JSON.stringify(local[part])!==JSON.stringify(baseline[part]??local[part]))continue;\n        const updated=d[part]??(part==='cards'?[]:{});\n        if(JSON.stringify(local[part])!==JSON.stringify(updated)){\n          cache.setItem(profileKey(id,part),JSON.stringify(updated));\n          changedAny=true;\n        }\n      }\n      // Compartimos tambi\u00e9n los pesos del modo \u00abPriorizar falladas\u00bb. Los\n      // contadores se reconstruyen al incorporar nuevas partidas en la nube.\n      const remoteStats=d.stats||{};\n      const statsStillClean=JSON.stringify(local.stats)===JSON.stringify(baseline.stats??local.stats);\n      const mergedStats=statsStillClean?JSON.parse(JSON.stringify(remoteStats)):JSON.parse(JSON.stringify(local.stats));\n      for(const [code,rs] of Object.entries(remoteStats)){\n        if(!rs || typeof rs!=='object')continue;\n        const ls=mergedStats[code]||{};\n        if(Number(rs.smartUpdatedAt||0)>Number(ls.smartUpdatedAt||0)){\n          mergedStats[code]={...ls,\n            smartPriority:rs.smartPriority,\n            smartCorrectStreak:rs.smartCorrectStreak,\n            smartLastResult:rs.smartLastResult,\n            smartUpdatedAt:rs.smartUpdatedAt};\n        }\n      }\n      if(JSON.stringify(local.stats)!==JSON.stringify(mergedStats)){\n        cache.setItem(profileKey(id,'stats'),JSON.stringify(mergedStats));\n        changedAny=true;\n      }\n      return changedAny;\n  }\n  liveUnsubs.push(onSnapshot(cloudRef(),{includeMetadataChanges:false},snap=>{\n    if(!valid() || !snap.exists() || snap.metadata.hasPendingWrites)return;\n    const newRoster=snap.data().profiles;\n    if(!Array.isArray(newRoster) || newRoster.length>5)return;\n    if(isGameActive() || el('profilesDialog')?.open){deferredRoster=newRoster;return}\n    applyLiveRoster(newRoster);\n  },report));\n  function applyLiveRoster(newRoster){\n    const current=cache.getItem('blindOpProfiles');\n    const baseline=lastRoster;\n    lastRoster=JSON.stringify(newRoster);\n    if(current===lastRoster)return;\n    if(current!==baseline)return; // edici\u00f3n local pendiente, no sobrescribir\n    cache.setItem('blindOpProfiles',lastRoster);\n    requestVisualUpdate();\n  }\n  liveTimer=setInterval(()=>{\n    if(isGameActive() || el('editorDialog')?.open || el('profilesDialog')?.open)return;\n    if(deferredRoster){const next=deferredRoster;deferredRoster=null;applyLiveRoster(next)}\n    let changes=0;\n    for(const [id,data] of deferredProfileDocs){\n      if(applyLiveProfile(id,data))changes++;\n    }\n    deferredProfileDocs.clear();\n    for(const id of deferredSessions){if(combineCloudHistory(id))changes++}\n    deferredSessions.clear();\n    if(changes){scheduleSync(750);requestVisualUpdate()}\n    if(pendingVisualUpdate)requestVisualUpdate();\n  },900);\n  status('\u2601\ufe0f Sincronizaci\u00f3n en tiempo real activada');\n}\n\nasync function refreshFromCloud(){\n  if(!ready || !user)return;\n  if(isGameActive()){\n    status('Termina la partida antes de recargar los datos de la nube.');\n    return;\n  }\n  await syncNow();\n  if(syncingStatus.startsWith('No se pudo'))return;\n  // Una sesi\u00f3n local nunca se interrumpe por una actualizaci\u00f3n remota.\n  sessionStorage.removeItem('bt9CloudHydrated');\n  await bootstrapCloud(user);\n}\n\n// Parser CSV aut\u00e9ntico: admite comillas dobles, ; en celdas y CRLF.\nfunction parseSemicolonCsv(text){\n  const rows=[],row=[];let cell='',quoted=false;\n  text=String(text).replace(/^\\uFEFF/,'');\n  for(let i=0;i<text.length;i++){\n    const c=text[i];\n    if(c==='\"'){\n      if(quoted && text[i+1]==='\"'){cell+='\"';i++}else quoted=!quoted;\n    }else if(c===';' && !quoted){row.push(cell);cell=''}\n    else if((c==='\\n' || c==='\\r') && !quoted){\n      if(c==='\\r' && text[i+1]==='\\n')i++;\n      row.push(cell);cell='';if(row.some(Boolean))rows.push(row.slice());row.length=0;\n    }else cell+=c;\n  }\n  if(quoted)throw Error('Hay comillas sin cerrar en el CSV.');\n  row.push(cell);if(row.some(Boolean))rows.push(row);\n  return rows;\n}\nasync function importHistoryCsv(file){\n  if(!user||!ready)throw Error('Conecta la nube antes de importar.');\n  if(isGameActive())throw Error('Termina primero la partida para importar las estad\u00edsticas.');\n  if(file.size>8_000_000)throw Error('Archivo demasiado grande para esta importaci\u00f3n.');\n  const rows=parseSemicolonCsv(await file.text());\n  const headers=rows.shift()||[];\n  const names=['fecha_iso','sesion','posicion','tamano_sesion','letras','respuesta_correcta','respuesta_usuario','coincidencia_automatica','resultado_final','decision','modo'];\n  const indices=names.map(key=>headers.indexOf(key));\n  if(indices.some(i=>i<0))throw Error('El CSV no contiene las columnas de las estad\u00edsticas de Blind Trainer.');\n  const used=new Set(), mapped=[];\n  for(const row of rows){\n    const obj=Object.fromEntries(names.map((name,i)=>[name,row[indices[i]]??'']));\n    const pos=Number(obj.posicion),size=Number(obj.tamano_sesion);\n    if(!obj.sesion || !Number.isInteger(pos) || pos<1 || !obj.letras || !['acierto','fallo'].includes(obj.resultado_final))throw Error('Fila de historial no v\u00e1lida.');\n    const key=`${obj.sesion}|${pos}`;\n    if(used.has(key))throw Error('El archivo contiene partidas y posiciones repetidas.');\n    used.add(key);\n    mapped.push({\n      id:'hist-'+obj.sesion+'-'+pos,\n      timestamp:obj.fecha_iso,\n      sessionId:obj.sesion,\n      position:pos,\n      sessionSize:Number.isFinite(size)?size:0,\n      code:obj.letras,\n      expectedAnswer:obj.respuesta_correcta,\n      userAnswer:obj.respuesta_usuario,\n      automaticMatch:obj.coincidencia_automatica.toLowerCase()==='s\u00ed' || obj.coincidencia_automatica.toLowerCase()==='si',\n      finalCorrect:obj.resultado_final==='acierto',\n      decision:obj.decision,\n      answerMode:obj.modo||'self'\n    });\n  }\n  const sessions=new Set(mapped.map(a=>a.sessionId)).size;\n  const yes=confirm(`Se han le\u00eddo ${sessions} partidas y ${mapped.length} respuestas.\\n\\nSe importar\u00e1n al perfil JOAN sin modificar sus 420 asociaciones actuales. La operaci\u00f3n es repetible sin duplicar los registros.\\n\\n\u00bfImportar ahora?`);\n  if(!yes)return;\n  const local=snapshot(), joan=local.profiles.find(p=>String(p.name).trim().toUpperCase()==='JOAN');\n  if(!joan)throw Error('No encuentro el perfil JOAN en la nube.');\n  const old=cloneJson(cache.getItem(profileKey(joan.id,'attemptHistory')),[]);\n  const existing=new Set(old.map(uniqKey));\n  const added=mapped.filter(a=>!existing.has(uniqKey(a)));\n  if(!added.length){alert('Este archivo ya estaba importado: no se han duplicado respuestas.');return;}\n  const combined=mergeAttempts(old,added);\n  const stats={};\n  for(const a of combined){\n    const code=String(a.code||'');if(!code)continue;\n    stats[code]||={correct:0,wrong:0};\n    if(a.finalCorrect)stats[code].correct++;else stats[code].wrong++;\n  }\n  status(`Preparando ${added.length} respuestas para subir\u2026`);\n  cache.setItem(profileKey(joan.id,'attemptHistory'),JSON.stringify(combined));\n  cache.setItem(profileKey(joan.id,'stats'),JSON.stringify(stats));\n  await syncNow(true);\n  if(syncingStatus.startsWith('No se pudo')){\n    alert('El historial est\u00e1 guardado localmente, pero la sincronizaci\u00f3n fall\u00f3. No cierres la p\u00e1gina hasta reintentar.');\n    return;\n  }\n  alert(`Historial importado: ${added.length} respuestas nuevas de ${sessions} partidas.\\n\\nSe actualizar\u00
