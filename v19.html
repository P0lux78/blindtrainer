function patchOld(needle, value, label) {
  const at = html.indexOf(needle);
  if (at < 0 || html.indexOf(needle, at+needle.length) >= 0) throw new Error('No encuentro un anclaje único: '+label);
  html = html.slice(0, at) + value + html.slice(at+needle.length);
  done++;
}
function patchRegex(re, value, label) {
  const matches=html.match(re);
  if (!matches || matches.length!==1) throw new Error('No encuentro un anclaje único: '+label+' ('+(matches?.length||0)+')');
  html=html.replace(re,value);done++;
}

 patchOld('</style>', ".bt9-cover{position:fixed;inset:0;background:rgba(5,11,24,.96);z-index:9999;display:grid;place-items:center;padding:20px;overflow-y:auto;color:#f8fafc}\n.bt9-cover[hidden]{display:none!important}\n.bt9-panel{width:min(440px,100%);padding:26px;border-radius:22px;border:1px solid #334155;background:#111827;box-shadow:0 28px 100px #0009}\n.bt9-panel h2{font-size:1.5rem;margin:0 0 12px}.bt9-panel p{line-height:1.45;color:#cbd5e1;font-size:.94rem}\n.bt9-panel label{display:block;font-size:.84rem;color:#cbd5e1;margin:12px 0 5px}\n.bt9-panel input{display:block;width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #475569;border-radius:12px;color:white;padding:12px}\n.bt9-panel button,.bt9-bar button{background:#4f46e5;border:0;color:white;padding:11px 15px;border-radius:11px;cursor:pointer;font:inherit;font-weight:650}\n.bt9-panel button:disabled,.bt9-bar button:disabled{opacity:.5;cursor:wait}\n.bt9-panel .bt9-error{color:#fda4af;font-size:.89rem;white-space:pre-wrap}\n.bt9-panel .bt9-status{color:#93c5fd;font-size:.85rem;min-height:20px}\n.bt9-bar{position:fixed;left:50%;bottom:max(8px, env(safe-area-inset-bottom));transform:translateX(-50%);width:min(900px,calc(100% - 24px));background:#0f172aeF;border:1px solid #334155;border-radius:17px;z-index:900;box-shadow:0 12px 38px #0008;padding:8px;color:#f8fafc;backdrop-filter:blur(12px)}\n.bt9-bar[hidden]{display:none!important}\n.bt9-bar-header{display:flex;align-items:center;gap:9px;justify-content:space-between}\n.bt9-bar small{color:#94a3b8;font-size:.77rem}\n.bt9-bar button{font-size:.84rem;padding:8px 11px;background:#1e293b;border:1px solid #334155}\n.bt9-bar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid #334155}\n.bt9-bar-actions[hidden]{display:none!important}\n.bt9-bar-actions button{flex:1 1 135px}.bt9-bar-actions .bt9-green{background:#047857}\n" + '</style>', 'estilos Firebase V9');
 patchOld('</body>', "<div id=\"bt9Cover\" class=\"bt9-cover\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Blind Trainer en la nube\">\n <section class=\"bt9-panel\">\n  <h2>\u2601\ufe0f Blind Trainer \u00b7 Nube<\/h2>\n  <p>Las partidas, asociaciones y perfiles se sincronizan entre tus dispositivos con Firebase.<\/p>\n  <div id=\"bt9AuthFields\" hidden>\n   <form id=\"bt9AuthForm\">\n    <label for=\"bt9Email\">Correo de Firebase<\/label>\n    <input id=\"bt9Email\" type=\"email\" autocomplete=\"username\" required>\n    <label for=\"bt9Password\">Contrase\u00f1a<\/label>\n    <input id=\"bt9Password\" type=\"password\" autocomplete=\"current-password\" required>\n    <p class=\"bt9-error\" id=\"bt9AuthError\" role=\"alert\"><\/p>\n    <button type=\"submit\" id=\"bt9SignIn\">Entrar en mis perfiles<\/button>\n   <\/form>\n  <\/div>\n  <p id=\"bt9StartStatus\" class=\"bt9-status\">Iniciando conexi\u00f3n segura\u2026<\/p>\n  <p style=\"font-size:.78rem\">Tu historial no forma parte de los archivos p\u00fablicos de GitHub. Nunca compartas aqu\u00ed tu contrase\u00f1a.<\/p>\n <\/section>\n<\/div>\n<div class=\"bt9-bar\" id=\"bt9Bar\" hidden>\n <div class=\"bt9-bar-header\">\n  <div><strong>\u2601\ufe0f Blind Trainer<\/strong><small id=\"bt9CloudStatus\"> \u00b7 Sincronizaci\u00f3n pendiente<\/small><\/div>\n  <button type=\"button\" id=\"bt9Toggle\">Opciones<\/button>\n <\/div>\n <div class=\"bt9-bar-actions\" id=\"bt9Actions\" hidden>\n  <button type=\"button\" id=\"bt9ImportCsv\" class=\"bt9-green\">\ud83d\udce5 Importar historial CSV<\/button>\n  <button type=\"button\" id=\"bt9Sync\">\ud83d\udd04 Sincronizar ahora<\/button>\n  <button type=\"button\" id=\"bt9Export\">\ud83d\udcbe Copia local<\/button>\n  <button type=\"button\" id=\"bt9Logout\">Salir de la nube<\/button>\n <\/div>\n <input id=\"bt9InputCsv\" type=\"file\" accept=\".csv,text/csv\" hidden>\n<\/div>\n" + '<scr'+'ipt type="module">\n' + "import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';\nimport {getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';\nimport {getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, getDocs, writeBatch, serverTimestamp, onSnapshot} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';\n\n// Configuraci\u00f3n p\u00fablica del proyecto. NUNCA se incluye una contrase\u00f1a ni el historial en GitHub.\nconst firebaseConfig = {\n  apiKey: 'AIzaSyBFMcWUYfaC3HBDa25SVwlEQ_O_HGQgzx8',\n  authDomain: 'blind-trainer.firebaseapp.com',\n  projectId: 'blind-trainer',\n  storageBucket: 'blind-trainer.firebasestorage.app',\n  messagingSenderId: '316230978765',\n  appId: '1:316230978765:web:a820f888a57687faf5ad84'\n};\n\nconst firebaseApp=initializeApp(firebaseConfig);\nconst auth=getAuth(firebaseApp);\n// Cach\u00e9 persistente de Firestore: permite conservar operaciones pendientes sin red.\nlet db;\ntry {\n  db=initializeFirestore(firebaseApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});\n} catch(error) {\n  console.warn('No se pudo habilitar la persistencia, se usar\u00e1 el cach\u00e9 normal:',error);\n  db=getFirestore(firebaseApp);\n}\nconst el=id=>document.getElementById(id);\nconst cache=window.__blindCloudV9Storage;\nconst cloneJson=(v,fallback)=>{try{return JSON.parse(v)}catch{return fallback}};\nconst profileKey=(id,part)=>`blindOpProfile:${id}:${part}`;\nconst uniqKey=x=>`${x.sessionId || ''}|${x.position || 0}`;\nlet user=null, ready=false, syncing=false, rerun=false, syncTimer=null, syncingStatus='';\nlet lastRoster='', lastProfiles=new Map(), lastSessions=new Map();\nlet remoteSessions=new Map();\nlet currentLoadToken=0, lastPullAt=0;\nlet liveUnsubs=[], pendingVisualUpdate=false, liveTimer=null;\nlet liveSyncDebounce=null, liveBuffering=false;\nconst deferredSessions=new Set(), deferredProfileDocs=new Map();\nlet deferredRoster=null;\n\nfunction status(message, isError=false){\n  syncingStatus=message;\n  if(el('bt9CloudStatus')){\n    el('bt9CloudStatus').textContent=' \u00b7 '+message;\n    el('bt9CloudStatus').style.color=isError?'#fda4af':'#94a3b8';\n  }\n  if(el('bt9StartStatus')) el('bt9StartStatus').textContent=message;\n}\nfunction fatal(message){status(message,true);el('bt9AuthFields').hidden=false;el('bt9Cover').hidden=false;}\nfunction snapshot(){\n  const profiles=cloneJson(cache.getItem('blindOpProfiles'),[]);\n  if(!Array.isArray(profiles)) throw Error('Lista de perfiles incorrecta.');\n  if(profiles.length>5) throw Error('Se ha superado el m\u00e1ximo de cinco perfiles.');\n  return {\n    profiles: profiles.map(p=>({id:String(p.id),name:String(p.name),createdAt:p.createdAt||''})),\n    selected:cache.getItem('blindOpActiveProfileId'),\n    profileData:profiles.map(p=>({\n      id:p.id,\n      cards:cloneJson(cache.getItem(profileKey(p.id,'cards')),null),\n      stats:cloneJson(cache.getItem(profileKey(p.id,'stats')),{}),\n      preferences:cloneJson(cache.getItem(profileKey(p.id,'preferences')),{}),\n      attempts:cloneJson(cache.getItem(profileKey(p.id,'attemptHistory')),[])\n    }))\n  };\n}\nfunction groupSessions(snapshotValue){\n  const out=new Map();\n  for(const p of snapshotValue.profileData){\n    if(!Array.isArray(p.attempts)) continue;\n    for(const a of p.attempts){\n      const sid=String(a.sessionId||'');\n      if(!sid || sid.includes('/') || sid==='.' || sid==='..') continue;\n      const key=`${p.id}__${sid}`;\n      if(!out.has(key))out.set(key,{profileId:p.id,sessionId:sid,attempts:[]});\n      out.get(key).attempts.push(a);\n    }\n  }\n  for(const val of out.values())val.attempts.sort((a,b)=>(Number(a.position)||0)-(Number(b.position)||0));\n  return out;\n}\nfunction savedProfilesKey(uid){return 'blindCloudV9KnownUser';}\nfunction cloudRef(){return doc(db,'users',user.uid,'workspace','main')}\nfunction profileRef(pid){return doc(db,'users',user.uid,'profiles',pid)}\nfunction sessionRef(key){return doc(db,'users',user.uid,'sessions',key)}\nfunction isGameActive(){\n  return el('gamePanel')?.classList.contains('show') || (el('voicePanel') && !el('voicePanel').classList.contains('hidden'));\n}\nfunction mergeAttempts(remote,local){\n  const entries=new Map();\n  for(const a of remote || [])entries.set(uniqKey(a),a);\n  for(const a of local || []){\n    const key=uniqKey(a), existing=entries.get(key);\n    if(!existing){entries.set(key,a);continue}\n    // Si corregiste un resultado sin conexi\u00f3n, prevalece la correcci\u00f3n m\u00e1s nueva.\n    const oldCorrection=Date.parse(existing.correctedAt||'')||0;\n    const localCorrection=Date.parse(a.correctedAt||'')||0;\n    if(localCorrection>oldCorrection)entries.set(key,a);\n  }\n  return [...entries.values()].sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')) || ((Number(a.position)||0)-(Number(b.position)||0)));\n}\nfunction rememberLocal(label){\n  const snap=snapshot();\n  const data={format:'blindtrainer-v9-backup',date:new Date().toISOString(),label,profiles:snap.profiles,data:snap.profileData};\n  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});\n  const url=URL.createObjectURL(blob), link=document.createElement('a');\n  link.href=url;link.download=`blindtrainer_copia_${new Date().toISOString().slice(0,10)}.json`;\n  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);\n}\nfunction mapFromCurrent(){\n  const s=snapshot();\n  lastRoster=JSON.stringify(s.profiles);\n  lastProfiles=new Map(s.profileData.map(p=>[p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences})]));\n  lastSessions=new Map([...groupSessions(s)].map(([k,v])=>[k,JSON.stringify(v.attempts)]));\n}\n\n// Sincronizaci\u00f3n segura: escribe \u00fanicamente lo que haya cambiado, sin duplicar partidas.\nasync function syncNow(force=false){\n  if(!ready || !user)return;\n  if(syncing){rerun=true;return}\n  syncing=true;\n  try{\n    const local=snapshot(), groups=groupSessions(local), operations=[];\n    const roster=JSON.stringify(local.profiles);\n    if(lastRoster!==roster || force && !lastRoster){\n      operations.push({ref:cloudRef(),data:{profiles:local.profiles,version:1,updatedAt:serverTimestamp()}});\n    }\n    for(const p of local.profileData){\n      const encoded=JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences});\n      if(encoded!==lastProfiles.get(p.id)){\n        operations.push({ref:profileRef(p.id),data:{cards:p.cards||[],stats:p.stats||{},preferences:p.preferences||{},updatedAt:serverTimestamp()}});\n      }\n    }\n    for(const [key,item] of groups){\n      const encoded=JSON.stringify(item.attempts);\n      if(encoded!==lastSessions.get(key)){\n        operations.push({ref:sessionRef(key),data:{profileId:item.profileId,sessionId:item.sessionId,attempts:item.attempts,updatedAt:serverTimestamp()}});\n      }\n    }\n    if(!operations.length){status('Datos al d\u00eda');return}\n    status(`Guardando ${operations.length} cambios\u2026`);\n    // Firestore permite lotes de hasta 500 operaciones; aqu\u00ed usamos 200 para mayor margen.\n    for(let offset=0;offset<operations.length;offset+=200){\n      const batch=writeBatch(db);\n      for(const op of operations.slice(offset,offset+200))batch.set(op.ref,op.data);\n      await batch.commit();\n    }\n    lastRoster=roster;\n    for(const p of local.profileData)lastProfiles.set(p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences}));\n    for(const [key,item] of groups)lastSessions.set(key,JSON.stringify(item.attempts));\n    status(`${groups.size} partidas en la nube`);\n  }catch(error){\n    console.error('Blind Trainer nube: error al guardar',error);\n    status('No se pudo sincronizar. Los datos siguen guardados en este dispositivo.',true);\n  }finally{\n    syncing=false;\n    if(rerun){rerun=false;scheduleSync(600)}\n  }\n}\nfunction scheduleSync(delay=1700){\n  if(!ready)return;\n  clearTimeout(syncTimer);\n  syncTimer=setTimeout(()=>syncNow(),delay);\n}\nwindow.addEventListener('bt9-local-change',event=>{\n  const key=event.detail?.key || '';\n  if(key==='blindOpProfiles' || key.startsWith('blindOpProfile:'))scheduleSync();\n});\nwindow.addEventListener('online',()=>{\n  if(!ready)return;\n  status('Conexi\u00f3n recuperada. Enviando pendientes\u2026');\n  scheduleSync(450);\n});\nwindow.addEventListener('offline',()=>{\n  if(ready)status('Sin conexi\u00f3n. Partidas guardadas en este dispositivo hasta volver a conectarte.');\n});\ndocument.addEventListener('visibilitychange',()=>{\n  if(document.visibilityState==='visible' && ready){\n    scheduleSync(750);\n    requestVisualUpdate();\n  }\n});\n\nasync function bootstrapCloud(loggedIn){\n  stopLiveSync();\n  const token=++currentLoadToken;\n  user=loggedIn;\n  ready=false;\n  status('Consultando perfiles de Firebase\u2026');\n  const metaSnapshot=await getDoc(cloudRef());\n  if(token!==currentLoadToken)return;\n  if(!metaSnapshot.exists()){\n    // Primera conexi\u00f3n: se crea la estructura del usuario, sin publicar ning\u00fan CSV.\n    const local=snapshot();\n    if(!local.profiles.length)throw Error('No encuentro los perfiles del entrenador.');\n    const batch=writeBatch(db);\n    batch.set(cloudRef(),{profiles:local.profiles,version:1,updatedAt:serverTimestamp()});\n    for(const p of local.profileData){\n      batch.set(profileRef(p.id),{cards:p.cards||[],stats:p.stats||{},preferences:p.preferences||{},updatedAt:serverTimestamp()});\n    }\n    await batch.commit();\n    lastRoster=JSON.stringify(local.profiles);\n    lastProfiles=new Map(local.profileData.map(p=>[p.id,JSON.stringify({cards:p.cards,stats:p.stats,preferences:p.preferences})]));\n    lastSessions=new Map();\n    status('Nube creada. Importa tu CSV cuando quieras.');\n  }else{\n    const remoteMeta=metaSnapshot.data(), remoteProfiles=remoteMeta.profiles||[];\n    if(!Array.isArray(remoteProfiles) || remoteProfiles.length>5)throw Error('Los perfiles de Firebase no tienen un formato v\u00e1lido.');\n    const profileDocs=await Promise.all(remoteProfiles.map(p=>getDoc(profileRef(p.id))));\n    const sessionDocs=await getDocs(collection(db,'users',user.uid,'sessions'));\n    if(token!==currentLoadToken)return;\n    remoteSessions=new Map();\n    for(const row of sessionDocs.docs){\n      const d=row.data();if(d.profileId && Array.isArray(d.attempts))remoteSessions.set(row.id,d);\n    }\n    const knownSameUser=window.localStorage.getItem(savedProfilesKey(user.uid))===user.uid;\n    const prior=snapshot();\n    const localById=new Map(prior.profileData.map(p=>[p.id,p]));\n    const remoteGrouped=new Map();\n    for(const data of remoteSessions.values()){\n      if(!remoteGrouped.has(data.profileId))remoteGrouped.set(data.profileId,[]);\n      remoteGrouped.get(data.profileId).push(...data.attempts);\n    }\n    let changed=cache.getItem('blindOpProfiles')!==JSON.stringify(remoteProfiles);\n    cache.setItem('blindOpProfiles',JSON.stringify(remoteProfiles));\n    if(!remoteProfiles.some(p=>p.id===cache.getItem('blindOpActiveProfileId'))){\n      cache.setItem('blindOpActiveProfileId',remoteProfiles[0]?.id||'');changed=true;\n    }\n    for(let i=0;i<remoteProfiles.length;i++){\n      const p=remoteProfiles[i], d=profileDocs[i].exists()?profileDocs[i].data():{};\n      const local=localById.get(p.id);\n      for(const part of ['cards','stats','preferences']){\n        const value=d[part]??(knownSameUser?local?.[part]:null)??(part==='cards'?[]:{});\n        const serialized=JSON.stringify(value);\n        if(cache.getItem(profileKey(p.id,part))!==serialized){changed=true;cache.setItem(profileKey(p.id,part),serialized)}\n      }\n      // Ya se est\u00e1 trayendo la tabla JOAN de Firebase: impedir que la migraci\u00f3n\n      // antigua de 420 asociaciones sobrescriba ediciones hechas en otro dispositivo.\n      if(String(p.name).trim().toUpperCase()==='JOAN'){\n        cache.setItem(profileKey(p.id,'joan420MigratedV2'),'1');\n      }\n      const remoteAttempts=remoteGrouped.get(p.id)||[];\n      const attempts=mergeAttempts(remoteAttempts,knownSameUser?local?.attempts:[]);\n      const serialized=JSON.stringify(attempts);\n      if(cache.getItem(profileKey(p.id,'attemptHistory'))!==serialized){changed=true;cache.setItem(profileKey(p.id,'attemptHistory'),serialized)}\n    }\n    lastRoster=JSON.stringify(remoteProfiles);\n    lastProfiles=new Map(remoteProfiles.map((p,i)=>{\n      const x=profileDocs[i].exists()?profileDocs[i].data():{};\n      return [p.id,JSON.stringify({cards:x.cards||[],stats:x.stats||{},preferences:x.preferences||{}})];\n    }));\n    lastSessions=new Map([...remoteSessions].map(([k,v])=>[k,JSON.stringify(v.attempts)]));\n    if(changed && sessionStorage.getItem('bt9CloudHydrated')!==user.uid){\n      sessionStorage.setItem('bt9CloudHydrated',user.uid);\n      window.localStorage.setItem(savedProfilesKey(user.uid),user.uid);\n      location.reload();return;\n    }\n    status(`${remoteSessions.size} partidas recuperadas`);\n  }\n  window.localStorage.setItem(savedProfilesKey(user.uid),user.uid);\n  ready=true;\n  el('bt9Cover').hidden=true;\n  el('bt9Bar').hidden=false;\n  el('bt9AuthFields').hidden=true;\n  if(metaSnapshot.exists())scheduleSync(700);\n  startLiveSync();\n}\n\n// V10: tres listeners de Firestore, activos mientras la sesi\u00f3n de Firebase est\u00e1 abierta.\n// S\u00f3lo vuelcan cambios en los datos locales; no recargan la p\u00e1gina ni abortan el micro.\nfunction stopLiveSync(){\n  for(const unsub of liveUnsubs){try{unsub()}catch{}}\n  liveUnsubs=[];\n  clearTimeout(liveSyncDebounce);\n  clearInterval(liveTimer);\n  liveTimer=null;pendingVisualUpdate=false;\n  deferredSessions.clear();deferredProfileDocs.clear();deferredRoster=null;\n}\nfunction requestVisualUpdate(){\n  pendingVisualUpdate=true;\n  if(!isGameActive() && window.__blindV10ApplyCloudToUI?.())pendingVisualUpdate=false;\n}\nfunction smartStatsFromHistory(profileId){\n  const history=cloneJson(cache.getItem(profileKey(profileId,'attemptHistory')),[]);\n  const previous=cloneJson(cache.getItem(profileKey(profileId,'stats')),{});\n  const result={};\n  for(const row of history){\n    const code=String(row.code||'');if(!code)continue;\n    if(!result[code])result[code]={...(previous[code]||{}),correct:0,wrong:0};\n    if(row.finalCorrect)result[code].correct++;\n    else result[code].wrong++;\n  }\n  // Conservamos metadata de entrenamiento de parejas a\u00fan sin partidas.\n  for(const [code,st] of Object.entries(previous)){\n    if(!result[code] && (st.smartPriority || st.smartUpdatedAt))\n      result[code]={...st,correct:0,wrong:0};\n  }\n  return result;\n}\nfunction combineCloudHistory(profileId){\n  const all=[];\n  for(const item of remoteSessions.values())if(item.profileId===profileId)all.push(...item.attempts);\n  const old=cloneJson(cache.getItem(profileKey(profileId,'attemptHistory')),[]);\n  const merged=mergeAttempts(all,old);\n  const text=JSON.stringify(merged);\n  if(cache.getItem(profileKey(profileId,'attemptHistory'))===text)return false;\n  cache.setItem(profileKey(profileId,'attemptHistory'),text);\n  const rebuilt=JSON.stringify(smartStatsFromHistory(profileId));\n  if(cache.getItem(profileKey(profileId,'stats'))!==rebuilt)cache.setItem(profileKey(profileId,'stats'),rebuilt);\n  return true;\n}\nfunction startLiveSync(){\n  stopLiveSync();\n  if(!ready || !user)return;\n  const uid=user.uid;\n  const valid=()=>ready && !!user && user.uid===uid;\n  function report(error){\n    if(!valid())return;\n    console.warn('Escucha Firebase:',error);\n    status('No se reciben cambios en directo; la copia local se conserva.',true);\n  }\n  // Una colecci\u00f3n de sesiones por usuario; no se reemplaza el historial entero.\n  liveUnsubs.push(onSnapshot(collection(db,'users',uid,'sessions'),{includeMetadataChanges:false},snap=>{\n    if(!valid() || snap.metadata.hasPendingWrites)return;\n    const touched=new Set();\n    for(const changed of snap.docChanges()){\n      const key=changed.doc.id;\n      if(changed.type==='removed'){\n        remoteSessions.delete(key);lastSessions.delete(key);\n        continue;\n      }\n      const data=changed.doc.data();\n      if(!data.profileId || !Array.isArray(data.attempts))continue;\n      const before=remoteSessions.get(key);\n      remoteSessions.set(key,data);\n      lastSessions.set(key,JSON.stringify(data.attempts));\n      if(JSON.stringify(before?.attempts)!==JSON.stringify(data.attempts))touched.add(data.profileId);\n    }\n    let changes=0;\n    for(const profileId of touched){\n      if(isGameActive() || el('editorDialog')?.open){deferredSessions.add(profileId);continue;}\n      if(combineCloudHistory(profileId))changes++;\n    }\n    if(changes){\n      requestVisualUpdate();\n      scheduleSync(900); // sube \u00fanicamente intentos locales que falten en Firebase\n    }\n    if(!snap.metadata.fromCache && changes)status('Cambios de otros dispositivos recibidos');\n  },report));\n  liveUnsubs.push(onSnapshot(collection(db,'users',uid,'profiles'),{includeMetadataChanges:false},snap=>{\n    if(!valid() || snap.metadata.hasPendingWrites)return;\n    let changedAny=false;\n    for(const ch of snap.docChanges()){\n      if(ch.type==='removed')continue;\n      const id=ch.doc.id;\n      const d=ch.doc.data();\n      if(isGameActive() || el('editorDialog')?.open || el('profilesDialog')?.open){\n        deferredProfileDocs.set(id,d);continue;\n      }\n      if(applyLiveProfile(id,d))changedAny=true;\n    }\n    if(changedAny){requestVisualUpdate();scheduleSync(1100)}\n  },report));\n  function applyLiveProfile(id,d){\n      let changedAny=false;\n      const baseline=cloneJson(lastProfiles.get(id),{});\n      const local={\n        cards:cloneJson(cache.getItem(prof i++){\n    const c=text[i];\n    if(c==='\"'){\n      if(quoted && text[i+1]==='\"'){cell+='\"';i++}else quoted=!quoted;\n    }else if(c===';' && !quoted){row.push(cell);cell=''}\n    else if((c==='\\n' || c==='\\r') && !quoted){\n      if(c==='\\r' && text[i+1]==='\\n')i++;\n      row.push(cell);cell='';if(row.some(Boolean))rows.push(row.slice());row.length=0;\n    }else cell+=c;\n  }\n  if(quoted)throw Error('Hay comillas sin cerrar en el CSV.');\n  row.push(cell);if(row.some(Boolean))rows.push(row);\n  return rows;\n}\nasync function importHistoryCsv(file){\n  if(!user||!ready)throw Error('Conecta la nube antes de importar.');\n  if(isGameActive())throw Error('Termina primero la partida para importar las estad\u00edsticas.');\n  if(file.size>8_000_000)throw Error('Archivo demasiado grande para esta importaci\u00f3n.');\n  const rows=parseSemicolonCsv(await file.text());\n  const headers=rows.shift()||[];\n  const names=['fecha_iso','sesion','posicion','tamano_sesion','letras','respuesta_correcta','respuesta_usuario','coincidencia_automatica','resultado_final','decision','modo'];\n  const indices=names.map(key=>headers.indexOf(key));\n  if(indices.some(i=>i<0))throw Error('El CSV no contiene las columnas de las estad\u00edsticas de Blind Trainer.');\n  const used=new Set(), mapped=[];\n  for(const row of rows){\n    const obj=Object.fromEntries(names.map((name,i)=>[name,row[indices[i]]??'']));\n    const pos=Number(obj.posicion),size=Number(obj.tamano_sesion);\n    if(!obj.sesion || !Number.isInteger(pos) || pos<1 || !obj.letras || !['acierto','fallo'].includes(obj.resultado_final))throw Error('Fila de historial no v\u00e1lida.');\n    const key=`${obj.sesion}|${pos}`;\n    if(used.has(key))throw Error('El archivo contiene partidas y posiciones repetidas.');\n    used.add(key);\n    mapped.push({\n      id:'hist-'+obj.sesion+'-'+pos,\n      timestamp:obj.fecha_iso,\n      sessionId:obj.sesion,\n      position:pos,\n      sessionSize:Number.isFinite(size)?size:0,\n
